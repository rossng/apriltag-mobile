name: Update flake.lock

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@v29
        with:
          pr-title: 'Update flake.lock'
